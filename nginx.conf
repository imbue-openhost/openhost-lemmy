worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;

    # Lemmy uploads can be a few MB (images via pict-rs, but we
    # don't bundle pict-rs in this build — see the README).  20 MiB
    # is a comfortable headroom for federated post bodies + the
    # occasional avatar PUT.
    client_max_body_size 20m;

    # Buffering: Lemmy's API does a lot of small JSON; default
    # buffers are fine.  Federation inbox POSTs can be larger; let
    # nginx buffer up to 1 MiB before disk-spilling.
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_busy_buffers_size 16k;

    # Timeouts: Lemmy backend sometimes does slow DB scans on
    # cold caches; default 60s is fine.  Federation is async and
    # not on the request path.
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Forward the X-OpenHost-Is-Owner header verbatim — the OIDC
    # bridge needs it for /authorize.  We do NOT trust client-
    # supplied X-OpenHost-* headers; the OpenHost router strips
    # them before stamping its own, but the SSO-bounce sidecar
    # also re-strips defensively.

    upstream backend  { server 127.0.0.1:8536; }
    upstream ui       { server 127.0.0.1:1234; }
    upstream bridge   { server 127.0.0.1:7000; }
    upstream bouncer  { server 127.0.0.1:7100; }

    server {
        listen 8080 default_server;
        server_name _;

        # The OpenHost router strips Host and sets X-Forwarded-Host
        # to the public hostname.  Preserve that through the next
        # proxy hop (nginx → bridge / bouncer) by re-forwarding the
        # received X-Forwarded-Host, not nginx's $http_host (which
        # is the loopback that compute_space binds).
        #
        # Fall back to $http_host so the chain still works during
        # local-loopback testing where X-Forwarded-Host isn't set.

        # OIDC bridge — discovery / jwks / token / userinfo are
        # public per openhost.toml; /authorize requires the
        # X-OpenHost-Is-Owner header which only the OpenHost
        # router will stamp.
        location /_oidc/ {
            proxy_pass http://bridge;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-OpenHost-Is-Owner $http_x_openhost_is_owner;
        }

        # SSO bouncer — the page Lemmy-ui's /login button would
        # redirect to.  Serves a tiny HTML doc that primes
        # localStorage and 302s to the OIDC /authorize endpoint.
        # Owner-gated by the bouncer itself (which checks
        # X-OpenHost-Is-Owner).
        location = /sso-bounce {
            proxy_pass http://bouncer;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-OpenHost-Is-Owner $http_x_openhost_is_owner;
        }

        # Lemmy backend API + federation surface.  POSTs to
        # /api/v3/* (login, oauth/authenticate, etc), GETs to
        # /api/v3/site (called anonymously by federation peers
        # AND by lemmy-ui's SSR), webfinger, nodeinfo, inbox.
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /pictrs/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 50m;
        }
        location /feeds/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /nodeinfo/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /.well-known/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # ActivityPub surface that federated servers POST to.
        location /inbox {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ~ ^/(u|c|post|comment)/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Owner SSO bounce: when the OpenHost router has stamped
        # X-OpenHost-Is-Owner on an HTML navigation AND the visitor
        # has no Lemmy ``jwt`` cookie, route them through the
        # bouncer first so the OIDC dance kicks off.  Otherwise
        # forward to lemmy-ui SSR.
        #
        # We use a `map` to compute the destination because nginx
        # `if` is evil; the map is at the top of the file.

        # /oauth/callback is the URL Lemmy redirects the browser to
        # after the OIDC dance.  The bouncer must NOT fire on it
        # (the browser still has no jwt cookie at this point — it
        # only gets one after lemmy-ui's OAuthCallback component
        # POSTs the code+state to /api/v3/oauth/authenticate).
        # Without this exception the bouncer redirect-loops every
        # owner visit through /sso-bounce → /authorize → /callback
        # → /sso-bounce → ...
        location = /oauth/callback {
            proxy_pass http://ui;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }

        # Lemmy UI / SPA / federation HTML.  Bounce owners through
        # /sso-bounce when they don't yet have a Lemmy session.
        location / {
            # Bounce condition: owner header set + no jwt cookie +
            # not already on the bounce or oidc paths + Accept
            # contains text/html.  We approximate with three
            # nested ifs in nginx's terrible config language.
            set $should_bounce "0";
            if ($http_x_openhost_is_owner = "true") { set $should_bounce "${should_bounce}o"; }
            if ($cookie_jwt = "")                   { set $should_bounce "${should_bounce}n"; }
            if ($http_accept ~ "text/html")         { set $should_bounce "${should_bounce}h"; }
            if ($should_bounce = "0onh") {
                rewrite ^/?(.*)$ /sso-bounce?prev=/$1 last;
            }

            proxy_pass http://ui;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            # lemmy-ui uses websockets for live-update streaming.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }
    }
}
